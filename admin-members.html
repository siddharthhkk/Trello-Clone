<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Members - Trello Clone</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f5f7; color: #172b4d; }
        .container { max-width: 900px; margin: auto; background: white; padding: 24px; border-radius: 8px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); }
        h1, h2, h3 { color: #172b4d; margin-top: 0; }
        a { color: #0079bf; text-decoration: none; }
        a:hover { text-decoration: underline; }
        input, select, button, textarea { padding: 10px; margin: 5px 0; width: 100%; font-size: 14px; }
        button, .btn { background-color: #0079bf; color: white; border: none; cursor: pointer; border-radius: 4px; display: inline-block; text-align: center; width: auto; padding: 10px 16px; text-decoration: none; }
        button:hover, .btn:hover { background-color: #026aa7; }
        button.secondary, .btn.secondary { background-color: #6b778c; }
        button.danger, .btn.danger { background-color: #eb5a46; }
        button.danger:hover, .btn.danger:hover { background-color: #cf513d; }
        .nav { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #dfe1e6; }
        .message { margin-top: 10px; padding: 10px; border-radius: 4px; }
        .message.success { background: #e3fcef; color: #006644; }
        .message.error { background: #ffebe6; color: #bf2600; }
        .card-list { display: grid; gap: 12px; margin: 16px 0; }
        .card { background: #ebecf0; padding: 14px; border-radius: 6px; }
        .card h3 { margin: 0 0 8px; }
        .card-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .form-row { margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <a class="btn secondary" id="backToOrg" href="orgs.html">Back to Org</a>
            <button class="secondary" onclick="logout()" style="margin-left:auto;">Logout</button>
        </div>

        <h1>Manage Members</h1>
        <p id="orgName"></p>

        <h2>Current Members</h2>
        <div id="membersList" class="card-list"></div>

        <h2>Add Member</h2>
        <div class="form-row">
            <input type="text" id="memberUsername" placeholder="Username to add">
        </div>
        <button onclick="addMember()">Add Member</button>
        <p id="message"></p>
    </div>
    <script src="api.js"></script>
    <script>
        if (!requireAuth()) throw new Error('redirecting')

        const orgId = requireQueryParam('orgId') // from URL: admin-members.html?orgId=1
        document.getElementById('backToOrg').href = `org.html?orgId=${orgId}`

        // Check user is admin → Week10.js GET /organization?orgId=
        async function loadOrgAndMembers() {
            const orgRes = await apiFetch(`/organization?orgId=${orgId}`)
            if (!orgRes.response.ok) {
                showMessage('message', orgRes.data.message || 'Could not load organization', true)
                return
            }

            if (!orgRes.data.org.isAdmin) {
                // non-admins get sent back to org page
                showMessage('message', 'Only org admins can manage members', true)
                setTimeout(() => {
                    window.location.href = `org.html?orgId=${orgId}`
                }, 1200)
                return
            }

            document.getElementById('orgName').innerText = orgRes.data.org.title
            loadMembers()
        }

        // List members → Week10.js GET /members?orgId=
        async function loadMembers() {
            const { response, data } = await apiFetch(`/members?orgId=${orgId}`)
            const list = document.getElementById('membersList')
            list.innerHTML = ''

            if (!response.ok) {
                showMessage('message', data.message || 'Could not load members', true)
                return
            }

            if (!data.members || data.members.length === 0) {
                list.innerHTML = '<p>No members yet. Add someone below.</p>'
                return
            }

            data.members.forEach(member => {
                const div = document.createElement('div')
                div.className = 'card'
                div.innerHTML = `
                    <h3>${member.username}</h3>
                    <div class="card-actions">
                        <button class="danger" onclick="removeMember('${member.username}')">Remove</button>
                    </div>
                `
                list.appendChild(div)
            })
        }

        // Add user to org → Week10.js POST /add-member-to-org
        async function addMember() {
            const memberUsername = document.getElementById('memberUsername').value.trim()
            if (!memberUsername) {
                showMessage('message', 'Username is required', true)
                return
            }

            const { response, data } = await apiFetch('/add-member-to-org', {
                method: 'POST',
                body: JSON.stringify({ orgId: parseInt(orgId), memberUsername })
            })

            if (!response.ok) {
                showMessage('message', data.message || 'Could not add member', true)
                return
            }

            showMessage('message', data.message)
            document.getElementById('memberUsername').value = ''
            loadMembers()
        }

        // Remove user from org → Week10.js DELETE /members
        async function removeMember(memberUsername) {
            if (!confirm(`Remove ${memberUsername} from this organization?`)) return

            const { response, data } = await apiFetch('/members', {
                method: 'DELETE',
                body: JSON.stringify({ orgId: parseInt(orgId), memberUsername })
            })

            if (!response.ok) {
                showMessage('message', data.message || 'Could not remove member', true)
                return
            }

            showMessage('message', data.message)
            loadMembers()
        }

        loadOrgAndMembers() // run on page load
    </script>
</body>
</html>
