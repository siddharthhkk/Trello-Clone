<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trello Clone</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f5f7; color: #172b4d; }
        .container { max-width: 900px; margin: auto; background: white; padding: 24px; border-radius: 8px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); }
        h1, h2, h3 { color: #172b4d; margin-top: 0; }
        a { color: #0079bf; text-decoration: none; }
        a:hover { text-decoration: underline; }
        button, .btn { background-color: #0079bf; color: white; border: none; cursor: pointer; border-radius: 4px; display: inline-block; text-align: center; width: auto; padding: 10px 16px; text-decoration: none; }
        button:hover, .btn:hover { background-color: #026aa7; }
        button.secondary, .btn.secondary { background-color: #6b778c; }
        .nav { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #dfe1e6; }
        .auth-links { margin-top: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Trello Clone</h1>
        <p>Manage organizations, boards, and cards.</p>
        <div class="nav">
            <a class="btn" href="signin.html">Sign In</a>
            <a class="btn secondary" href="signup.html">Sign Up</a>
            <a class="btn secondary" href="orgs.html">My Organizations</a>
        </div>
        <p class="auth-links">Demo login: <strong>admin</strong> / <strong>123123</strong> (org 1 admin)</p>
    </div>
    <script src="api.js"></script>
    <script>
        // Landing page — skip this if already logged in (token in localStorage)
        if (getToken()) {
            window.location.href = 'orgs.html'; // → orgs.html
        }
    </script>
</body>
</html>
